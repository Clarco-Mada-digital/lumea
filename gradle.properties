# Réglé pour une machine modeste (≈4 Go de RAM, 2 cœurs) : le démon Gradle, le
# démon Kotlin et R8 doivent tenir ensemble en mémoire. Sur une machine plus
# grosse, monter Xmx et réactiver org.gradle.parallel accélère nettement.
# R8 épuisait le Metaspace pendant la minification de la release : le démon
# mourait en fin de build et le suivant repartait à froid. 768 Mo suffisent.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx900m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
