# Construit et publie une release signée dès qu'un tag `vX.Y.Z` est poussé.
#
# Déclenchement : `./scripts/release.sh 1.1.0` depuis la machine de dev.
#
# Secrets nécessaires dans le dépôt GitHub (Settings → Secrets → Actions) :
#   KEYSTORE_BASE64    le fichier lumea-release.jks encodé en base64
#   KEYSTORE_PASSWORD  mot de passe du keystore
#   KEY_ALIAS          alias de la clé (« lumea »)
#   KEY_PASSWORD       mot de passe de la clé
#
# Sans ces secrets, le build échoue volontairement : publier un APK signé avec la
# clé de debug rendrait toute mise à jour ultérieure impossible.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurer le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 est absent."
            echo "Sans lui, l'APK serait signé avec la clé de debug et aucune"
            echo "mise à jour ne serait possible pour les utilisatrices."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > lumea-release.jks
          cat > keystore.properties <<EOF
          storeFile=lumea-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Construire l'APK signé
        run: ./gradlew assembleRelease --no-daemon

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Renommer l'APK avec la version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk "lumea-$VERSION.apk"
          echo "APK_NAME=lumea-$VERSION.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Effacer les traces de la clé
        if: always()
        run: rm -f lumea-release.jks keystore.properties

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          name: Lumea ${{ env.VERSION }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: false
          # Les notes détaillées sont écrites à la main dans .github/, et
          # reprises telles quelles : une liste de commits ne dit rien à
          # quelqu'un qui vient télécharger l'application.
          body_path: .github/release-notes-${{ env.VERSION }}.md
