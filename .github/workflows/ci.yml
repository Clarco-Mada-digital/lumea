# Vérification à chaque poussée et à chaque pull request.
#
# Volontairement limitée à ce qui tourne sans appareil : les tests d'interface et
# de migration demandent un téléphone ou un émulateur, et les faire tourner ici
# multiplierait le temps de build par dix pour un gain faible en l'état.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compilation debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Le document médical est-il à jour ?
        run: |
          if ! git diff --quiet -- docs/CONTENU-MEDICAL.md; then
            echo "::error::docs/CONTENU-MEDICAL.md a changé sans être commité."
            echo "Le contenu médical a été modifié : régénère le document avec"
            echo "  ./gradlew testDebugUnitTest --tests '*MedicalContentExportTest*'"
            echo "puis commite-le, pour que la relecture porte sur la bonne version."
            git diff --stat -- docs/CONTENU-MEDICAL.md
            exit 1
          fi
